[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huntress-ctf-masterbot"
version = "0.1.0"
description = "Deterministic solver bot for the Huntress CTF 2026 Game Master"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.scripts]
hunt = "hunt.cli:main"

[tool.setuptools.packages.find]
include = ["hunt*"]
